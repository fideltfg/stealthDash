upstream docker_socket {
    server unix:/var/run/docker.sock;
}

server {
    listen 2375;
    server_name _;

    # The Dashboard widget may list containers.
    location = /containers/json {
        limit_except GET {
            deny all;
        }
        proxy_pass http://docker_socket;
    }

    # The Dashboard widget may read logs from a named container.
    location ~ ^/containers/[A-Za-z0-9_.-]+/logs$ {
        limit_except GET {
            deny all;
        }
        proxy_pass http://docker_socket;
    }

    # The Dashboard widget exposes these three container controls.
    location ~ ^/containers/[A-Za-z0-9_.-]+/(start|stop|restart)$ {
        limit_except POST {
            deny all;
        }
        proxy_pass http://docker_socket;
    }

    # Do not let the backend inspect images, volumes, filesystems, secrets,
    # container configuration, exec sessions, or any other Docker API path.
    location / {
        return 403;
    }
}
