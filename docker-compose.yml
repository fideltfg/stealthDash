services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: stealth-dashboard-app
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ping-server:
    build: ./ping-server
    container_name: stealth-ping-server
    ports:
      - "3001:3001"
    volumes:
      # Mount source files for hot reload
      - ./ping-server/src:/app/src
      - ./ping-server/routes:/app/routes
      - ./ping-server/plugins:/app/plugins
      - ./ping-server/tests:/app/tests
      - ./ping-server/jest.config.js:/app/jest.config.js
      - ./ping-server/test-reports:/app/test-reports
      # Prevent node_modules from being overwritten
      - /app/node_modules
    environment:
      - PING_SERVER_PORT=3001
      # Existing unix:///var/run/docker.sock widget settings are routed through
      # the restricted proxy instead of exposing the host socket here.
      - LOCAL_DOCKER_PROXY_URL=http://docker-socket-proxy:2375
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=dashboard
      - DB_USER=dashboard
      - DB_PASSWORD=dashboard123
      - JWT_SECRET=your-secret-key-change-in-production
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@dashboard.local}
      - DASHBOARD_URL=${DASHBOARD_URL:-http://localhost:3000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3001/api/gmail/callback}
    restart: unless-stopped
    depends_on:
      - postgres
      - docker-socket-proxy
    networks:
      - default
      - docker_api
    # Required for ICMP ping to work in container
    cap_add:
      - NET_RAW
      - NET_ADMIN

  docker-socket-proxy:
    image: nginx:alpine
    container_name: stealth-docker-socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./nginx-docker-socket-proxy-main.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-docker-socket-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - docker_api
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: stealth-postgres
    environment:
      - POSTGRES_DB=dashboard
      - POSTGRES_USER=dashboard
      - POSTGRES_PASSWORD=dashboard123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ping-server/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    restart: unless-stopped

  # Transparent nginx proxy for the HA Panel widget.
  # Proxies ALL Home Assistant traffic (HTML, JS, CSS, /api, WebSocket) through
  # port 3003 so the browser never makes cross-origin requests to HA.
  # Set HA_PANEL_URL in a .env file, e.g.:  HA_PANEL_URL=http://ha.norquay.local:8123
  ha-panel-proxy:
    image: nginx:alpine
    container_name: stealth-ha-panel-proxy
    ports:
      - "3003:80"
    volumes:
      - ./nginx-ha-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - HA_PANEL_URL=${HA_PANEL_URL:-http://homeassistant.local:8123}
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  docker_api:
    internal: true
